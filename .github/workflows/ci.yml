name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Bygg containern
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mitt-och-ditt:ci
      - name: Starta containern och kontrollera att den svarar
        run: |
          docker run -d --name app -p 3000:3000 mitt-och-ditt:ci
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/auth; then
              echo "Containern svarar."
              docker rm -f app
              exit 0
            fi
            sleep 2
          done
          echo "Containern svarade inte i tid."
          docker logs app
          docker rm -f app
          exit 1
