# Kör hela Mitt & Ditt lokalt eller på en server. Två tjänster, inget mer.
services:
  app:
    build:
      context: .
      args:
        # VITE_-variabler bakas in vid bygget. Sätt VITE_DEMO=1 för att köra
        # gränssnittet med exempeldata utan databas.
        VITE_DEMO: "${VITE_DEMO:-}"
    image: mitt-och-ditt:latest
    restart: unless-stopped
    ports:
      # Bara loopback. Caddy når appen inifrån compose-nätverket och behöver
      # ingen publicerad port. Publicerade portar i Docker går förbi ufw -
      # Docker skriver egna iptables-regler som utvärderas först - så en
      # bindning till 0.0.0.0 hade lagt ut appen okrypterad på internet trots
      # brandväggen.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://mittochditt:${POSTGRES_PASSWORD:?sätt POSTGRES_PASSWORD}@db:5432/mittochditt
      - APP_URL=${APP_URL:-https://mittochditt.goodstuff.se}
      - UPLOADS_DIR=/data/uploads
      # Seed-skriptet körs inne i containern och läser sina värden ur miljön.
      # .env styr bara substitution i den här filen; variablerna följer inte
      # med in i containern av sig själva utan måste namnges här.
      #
      # Skrivna som enbart namn, utan värde. Då lämnas variabeln osatt i
      # containern när den saknas i .env, och skriptets egen standard gäller.
      # Med ${SEED_ADMIN_EMAIL:-} hade den i stället blivit tom sträng, vilket
      # skriptet uppfattar som ett satt värde - och seedat en tom adress.
      - SEED_ADMIN_EMAIL
      - SEED_CAESAR_EMAIL
      - SEED_FELICIA_EMAIL
      # Samma skäl som ovan: skrivs som enbart namn. Osatt betyder stängd.
      - REGISTRATION_OPEN
      # Mailinställningarna finns även här, inte bara på mail-tjänsten: ett
      # svep går att köra för hand med docker compose exec app, och utan dem
      # hade det tyst använt fel transport.
      - MAIL_DISPATCH_INTERVAL_SECONDS
      - MAIL_QUEUE_ENCRYPTION_KEY
      - MAIL_TRANSPORT
      - MAIL_FROM
      - MAIL_REPLY_TO
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_SECURE
      - SMTP_USER
      - SMTP_PASSWORD
    volumes:
      # Bilagor ligger utanför containern så att de överlever en omstart.
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # Avsändaren av mail. Egen process med flit: webbservern bundlas även för
  # webbläsaren och kan inte hysa serverkod, och på en liten maskin ska en
  # bakgrundsloop inte konkurrera om minnet med det som svarar användarna.
  # Startas med: docker compose --profile mail up -d
  mail:
    image: mitt-och-ditt:latest
    profiles: ["mail"]
    restart: unless-stopped
    command: ["node", ".output/scripts/mail.mjs", "--loop"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://mittochditt:${POSTGRES_PASSWORD:?sätt POSTGRES_PASSWORD}@db:5432/mittochditt
      - APP_URL=${APP_URL:-https://mittochditt.goodstuff.se}
      - MAIL_DISPATCH_INTERVAL_SECONDS=${MAIL_DISPATCH_INTERVAL_SECONDS:-30}
      - MAIL_QUEUE_ENCRYPTION_KEY
      - MAIL_TRANSPORT
      - MAIL_FROM
      - MAIL_REPLY_TO
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_SECURE
      - SMTP_USER
      - SMTP_PASSWORD
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mittochditt
      POSTGRES_USER: mittochditt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?sätt POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mittochditt -d mittochditt"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Databasen exponeras inte utåt. Nå den via `docker compose exec db psql`.

  # TLS och domän. Startas med: docker compose --profile tls up -d
  # Caddy skaffar och förnyar certifikat automatiskt.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-mittochditt.goodstuff.se}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
